; Alembic configuration.
;
; The database URL is deliberately absent. It is read from settings in env.py so there is
; exactly one place a connection string comes from, and so a credential never lands in a
; file that gets committed.

[alembic]
script_location = packages/core/src/factory_core/migrations
prepend_sys_path = packages/core/src
; Alembic splits these paths on this separator. Without it, the legacy behaviour
; splits on spaces and colons too, which breaks any path containing a space.
path_separator = os
version_path_separator = os

; Revision filenames are prefixed with a zero-padded sequence so that `ls` shows them in
; apply order. Alembic's own ordering comes from down_revision, not the filename.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
