name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "24"

jobs:
  # ---------------------------------------------------------------------------
  # Fast feedback: everything that needs no services, first and in parallel.
  # ---------------------------------------------------------------------------
  quality:
    name: Lint, types and layering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy packages/core/src apps/api/src apps/worker/src scripts

      # Layering is enforced here, not by convention: core must not import a web
      # framework, and the API and worker must stay independent processes.
      - name: Import layering contracts
        run: uv run lint-imports

      # The 250-line rule. A file that outgrows a screenful stops being one idea.
      - name: File size limit
        run: uv run python scripts/check_file_size.py

  # ---------------------------------------------------------------------------
  # Backend tests, including the integration suite that needs a real database.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: factory_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Set so the integration suite runs rather than skipping. Locally it is usually
      # unset, and those tests skip with a message explaining what they cover.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/factory_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen

      - name: Migrations apply, revert and re-apply
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/factory_test
          JWT_SECRET_KEY: ci-only-secret-key-at-least-32-characters
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Tests with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-backend
          path: coverage.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # The generated TypeScript must match the API. Drift means the frontend is
  # compiling against a contract the backend no longer honours.
  # ---------------------------------------------------------------------------
  contracts:
    name: Contract drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: OpenAPI schema is current
        run: uv run python scripts/export_openapi.py --check

      - name: Generated types are current
        run: |
          pnpm --filter @factory/contracts generate
          git diff --exit-code -- packages/contracts/src/api.ts

  # ---------------------------------------------------------------------------
  # Frontend: lint, types, component tests, production build.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm --filter web lint

      - name: TypeScript
        run: |
          pnpm --filter @factory/contracts typecheck
          pnpm --filter web typecheck

      - name: Component tests
        run: pnpm --filter web test

      - name: Production build
        run: pnpm --filter web build

  # ---------------------------------------------------------------------------
  # End-to-end: the only tests that prove the whole stack works together.
  # ---------------------------------------------------------------------------
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: factory_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/factory_e2e
      JWT_SECRET_KEY: ci-only-secret-key-at-least-32-characters
      ENVIRONMENT: test
      API_BASE_URL: http://127.0.0.1:8000
      OBSERVABILITY__LOG_LEVEL: WARNING
      # Argon2 at production cost would dominate the run; e2e is not a hashing benchmark.
      SECURITY__ARGON2_TIME_COST: "1"
      SECURITY__ARGON2_MEMORY_COST_KIB: "8192"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: uv run alembic upgrade head

      # nohup + setsid detaches the server from this step's shell, so it survives when
      # the step ends. A plain `&` leaves it a child of a shell that is about to exit.
      - name: Start the API
        run: |
          nohup uv run uvicorn factory_api.main:create_app --factory             --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "API is healthy"
              break
            fi
            sleep 1
          done
          if ! curl -sf http://127.0.0.1:8000/health > /dev/null; then
            echo "::error::API did not become healthy within 60s"
            cat /tmp/api.log
            exit 1
          fi

      - name: Build and start the web app
        run: |
          pnpm --filter web build
          nohup pnpm --filter web start --port 3000 > /tmp/web.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/login > /dev/null; then
              echo "Web app is healthy"
              break
            fi
            sleep 1
          done
          if ! curl -sf http://127.0.0.1:3000/login > /dev/null; then
            echo "::error::Web app did not become healthy within 60s"
            cat /tmp/web.log
            exit 1
          fi

      - run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Playwright
        run: pnpm --filter web test:e2e

      - name: Server logs on failure
        if: failure()
        run: |
          echo "--- API ---"; tail -100 /tmp/api.log || true
          echo "--- WEB ---"; tail -100 /tmp/web.log || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
