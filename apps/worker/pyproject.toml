[project]
name = "factory-worker"
version = "0.1.0"
description = "Workflow executor process for the AI Software Factory"
requires-python = ">=3.13,<3.14"
dependencies = [
    "factory-core",
]

[project.scripts]
dev-worker = "factory_worker.__main__:main"

[tool.uv.sources]
factory-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_worker"]
