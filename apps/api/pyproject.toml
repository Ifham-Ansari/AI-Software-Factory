[project]
name = "factory-api"
version = "0.1.0"
description = "FastAPI transport layer for the AI Software Factory"
requires-python = ">=3.13,<3.14"
dependencies = [
    "factory-core",
    "fastapi>=0.141,<0.150",
    "uvicorn[standard]>=0.32,<1",
]

[project.scripts]
dev-api = "factory_api.__main__:main"

[tool.uv.sources]
factory-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_api"]
