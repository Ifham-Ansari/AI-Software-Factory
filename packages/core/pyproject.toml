[project]
name = "factory-core"
version = "0.1.0"
description = "Domain, application, persistence and infrastructure for the AI Software Factory"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0.50,<2.1",
    "psycopg[binary,pool]>=3.2,<4",
    "alembic>=1.19,<2",
    "argon2-cffi>=23.1,<26",
    "pyjwt>=2.10,<3",
    "structlog>=24.4,<26",
    "email-validator>=2.2,<3",
    # AES-256-GCM for envelope encryption (F-201). Authenticated encryption is the one
    # thing never to hand-roll; PyCA's binding to OpenSSL is the reference implementation.
    "cryptography>=44,<47",
    # Events fan-out, rate limiting, idempotency and distributed locks (F-207). The
    # official client; its asyncio interface is first-party, not a separate package.
    "redis>=5.2,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_core"]
