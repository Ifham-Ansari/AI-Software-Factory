[project]
name = "factory-core"
version = "0.1.0"
description = "Domain, application, persistence and infrastructure for the AI Software Factory"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0.50,<2.1",
    "psycopg[binary,pool]>=3.2,<4",
    "alembic>=1.19,<2",
    "argon2-cffi>=23.1,<26",
    "pyjwt>=2.10,<3",
    "structlog>=24.4,<26",
    "email-validator>=2.2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_core"]
